name: Windows client release
on:
  push:
    branches: [main]
permissions:
  contents: read
# No global concurrency group: every main push must retain its queued run.
jobs:
  build:
    if: github.repository == 'yxsimony-dot/CCB-USB-User'
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.419
            10.0.100
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - name: Resolve immutable version
        id: version
        shell: pwsh
        run: |
          Import-Module ./build/Packaging.psm1
          $version = Get-ProductVersion ./build/version.json '' -ReleaseSequence ([long]$env:GITHUB_RUN_NUMBER)
          "version=$($version.version)" >> $env:GITHUB_OUTPUT
      - name: Obtain verified Inno Setup 6.7.3
        shell: pwsh
        run: |
          New-Item artifacts/tools -ItemType Directory -Force | Out-Null
          $package = Join-Path $PWD 'artifacts/tools/inno.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne 'F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4') { throw 'Inno Setup package hash mismatch' }
          Expand-Archive $package artifacts/tools/inno
          $signature = Get-AuthenticodeSignature artifacts/tools/inno/tools/ISCC.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Inno compiler signature invalid' }
      - name: Test and build clean installer
        shell: pwsh
        run: |
          ./build/build.ps1 -IsccPath "$PWD/artifacts/tools/inno/tools/ISCC.exe" -OutputDirectory "$PWD/artifacts/release" -ReleaseSequence ([long]$env:GITHUB_RUN_NUMBER) -WorkflowRunId $env:GITHUB_RUN_ID
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.run_id }}
          path: artifacts/release/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/**
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: build
    if: github.repository == 'yxsimony-dot/CCB-USB-User' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.run_id }}
          path: artifacts/release
      - name: Upload draft, verify remote files, publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node build/release.cjs artifacts/release
